<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Make Slider</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

    <!-- Heading -->
    <h2 class="title">Make Slider Project</h2>

    <!-- Slider Container -->
    <div class="slider-container">
        <div class="slider">
            <div class="slide">
                <img src="https://cdn.pixabay.com/photo/2023/11/18/18/20/christmas-8396941_960_720.png" alt="Slide 1" />
            </div>

            <div class="slide">
                <img src="https://cdn.pixabay.com/photo/2018/08/15/13/10/new-year-background-3608029_1280.jpg"
                    alt="Slide 2" />
            </div>

            <div class="slide">
                <img src="https://cdn.pixabay.com/photo/2024/01/04/15/10/mountain-8487679_960_720.jpg" alt="Slide 3" />
            </div>

            <div class="slide">
                <img src="https://cdn.pixabay.com/photo/2023/12/30/21/14/fields-8478994_960_720.jpg" alt="Slide 4" />
            </div>

            <div class="slide">
                <img src="https://cdn.pixabay.com/photo/2020/04/30/20/14/sky-5114499_1280.jpg" alt="Slide 5" />
            </div>
        </div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button onclick="prevSlide()">Previous</button>
        <button onclick="nextSlide()">Next</button>
    </div>

    <!-- JavaScript -->
    <script src="./js/script.js"></script>
</body>

</html>
